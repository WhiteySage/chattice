name: Google upstream watch

# Compares the reviewed baseline with the official Google Chat discovery
# document, release feed, and Python SDK releases. A change opens one issue;
# no dependency or source update is applied automatically.

on:
  schedule:
    - cron: "17 6 * * *" # Daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Compare official Google sources with the reviewed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import subprocess
          import urllib.request
          from pathlib import Path

          BASELINE_PATH = Path(".github/upstream-baseline.json")
          DISCOVERY_URL = "https://chat.googleapis.com/$discovery/rest?version=v1"
          RELEASE_FEED_URL = "https://developers.google.com/feeds/chat-release-notes.xml"
          ISSUE_TITLE = "Google Chat upstream changed"


          def fetch(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "chattice-upstream-watch/1.0"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()


          def sha256(url: str) -> str:
              return hashlib.sha256(fetch(url)).hexdigest()


          def json_sha256(url: str) -> str:
              payload = json.loads(fetch(url))
              canonical = json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode()
              return hashlib.sha256(canonical).hexdigest()


          def pypi_latest(package: str) -> str:
              data = json.loads(fetch(f"https://pypi.org/pypi/{package}/json"))
              return data["info"]["version"]


          def gh(*args: str, capture: bool = False) -> str:
              result = subprocess.run(
                  ["gh", *args],
                  check=True,
                  text=True,
                  capture_output=capture,
              )
              return result.stdout.strip() if capture else ""


          baseline = json.loads(BASELINE_PATH.read_text())
          Path(".discovery").mkdir(exist_ok=True)
          Path(".discovery/chat-v1.json").write_bytes(fetch(DISCOVERY_URL))
          current = {
              "chat_discovery_sha256": json_sha256(DISCOVERY_URL),
              "chat_release_feed_sha256": sha256(RELEASE_FEED_URL),
              "google_apps_card": pypi_latest("google-apps-card"),
              "google_apps_chat": pypi_latest("google-apps-chat"),
              "google_auth": pypi_latest("google-auth"),
          }
          changed = [key for key in current if current[key] != baseline.get(key)]

          gh(
              "label",
              "create",
              "upstream",
              "--description",
              "Official Google API or SDK change requiring review",
              "--color",
              "0E8A16",
              "--force",
          )
          issues = json.loads(
              gh(
                  "issue",
                  "list",
                  "--label",
                  "upstream",
                  "--state",
                  "all",
                  "--limit",
                  "100",
                  "--json",
                  "number,state,title",
                  capture=True,
              )
          )
          tracked = next((item for item in issues if item["title"] == ISSUE_TITLE), None)

          if changed:
              rows = ["| Source | Reviewed | Current |", "| --- | --- | --- |"]
              for key in current:
                  marker = " **changed**" if key in changed else ""
                  rows.append(
                      f"| `{key}` | `{baseline.get(key, 'missing')}` | "
                      f"`{current[key]}`{marker} |"
                  )
              body = "\n".join(
                  [
                      "An official Google source differs from the reviewed baseline.",
                      "",
                      *rows,
                      "",
                      "Review the upstream change, update compatibility tests and "
                      "documentation when needed, then update "
                      "`.github/upstream-baseline.json`.",
                  ]
              )
              if tracked:
                  number = str(tracked["number"])
                  gh("issue", "edit", number, "--body", body)
                  if tracked["state"] == "CLOSED":
                      gh("issue", "reopen", number)
              else:
                  gh(
                      "issue",
                      "create",
                      "--title",
                      ISSUE_TITLE,
                      "--label",
                      "upstream",
                      "--body",
                      body,
                  )
              print("Changed:", ", ".join(changed))
          else:
              if tracked and tracked["state"] == "OPEN":
                  number = str(tracked["number"])
                  gh(
                      "issue",
                      "comment",
                      number,
                      "--body",
                      "The reviewed baseline now matches all monitored sources.",
                  )
                  gh("issue", "close", number)
              print("No upstream changes detected.")
          PY
      - name: Verify operation registry against the discovery document
        run: |
          uv run python scripts/verify_registry.py .discovery/chat-v1.json
          # Non-zero exit opens the alert path used by this workflow.
