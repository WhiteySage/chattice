name: Upstream watch

# Weekly scheduled watch of the Google wire layer and the official Chat
# release notes. On a change it opens/updates a single tracked `upstream`
# issue; the issue is then triaged through the standard upstream-change
# protocol in CONTRIBUTING.md (lossless first, additive adapter support
# second). No code changes are made automatically.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Watch PyPI and Google release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import subprocess
          import urllib.request

          CHAT_RELEASE_NOTES = (
              "https://developers.google.com/workspace/chat/release-notes"
          )

          def pypi_latest(package: str) -> str:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/{package}/json", timeout=30
              ) as response:
                  return json.load(response)["info"]["version"]

          findings = []
          for package in ("google-apps-chat", "google-apps-card", "google-auth"):
              latest = pypi_latest(package)
              findings.append(f"{package}: PyPI latest {latest}")

          try:
              with urllib.request.urlopen(CHAT_RELEASE_NOTES, timeout=30) as response:
                  notes_hash = hashlib.sha256(response.read()).hexdigest()[:12]
              findings.append(f"Chat release notes hash: {notes_hash}")
          except Exception as error:  # noqa: BLE001 - a watcher must not die on network errors
              findings.append(
                  f"Chat release notes: fetch failed ({type(error).__name__})"
              )

          report = "\n".join(findings)
          title = "upstream-watch: Google wire layer / release notes snapshot"
          try:
              existing = subprocess.run(
                  ["gh", "issue", "list", "--label", "upstream",
                   "--state", "open", "--json", "number", "--jq", ".[0].number"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
          except subprocess.CalledProcessError:
              existing = ""
          if existing:
              subprocess.run(
                  ["gh", "issue", "comment", existing, "--body",
                   f"Snapshot:\n\n```\n{report}\n```"],
                  check=True,
              )
          else:
              subprocess.run(
                  ["gh", "issue", "create", "--title", title,
                   "--label", "upstream",
                   "--body",
                   "Weekly snapshot of the Google wire layer. A new PyPI "
                   "version or a changed release-notes hash means the "
                   "upstream-change protocol in CONTRIBUTING.md applies.\n\n"
                   f"```\n{report}\n```"],
                  check=True,
              )
          print(report)
          PY
