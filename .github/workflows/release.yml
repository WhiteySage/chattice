name: Release

# Trusted Publishing release pipeline (prepared; publication requires the
# owner's explicit authorization — the `pypi` environment approval
# gate on GitHub enforces it).
#
# Flow: exact tag -> tests -> build -> verify -> clean install -> smoke
# -> PyPI via OIDC -> GitHub Release. Never auto-publishes on green main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=chattice --cov-report=term-missing
      - run: uv run mypy src tests
      - run: uv run mkdocs build --strict
      - run: uv build
      - run: bash scripts/verify_package.sh
      - name: Publish to PyPI (OIDC Trusted Publishing)
        run: uv publish --trusted-publishing always
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
